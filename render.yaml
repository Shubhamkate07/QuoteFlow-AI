services:
  - type: web
    name: quoteflow-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --timeout 120 --workers 2
    plan: free
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: USE_X_ACCEL_REDIRECT
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: quoteflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.netlify.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.netlify.app"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: quoteflow-db
    plan: free
